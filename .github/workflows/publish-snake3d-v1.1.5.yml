name: Publish fixed Snake 3D package
on:
  push:
    paths:
      - .github/workflows/publish-snake3d-v1.1.5.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify fixed game package
        env:
          PACKAGE_URL: https://7x7live.pro/snake3d-release-cache-93f65c12/win-unpacked.zip
          PACKAGE_SHA256: C526A55515AC6FF47EC935DB924B7D4E65D9B6E975F50DF128538304E7EAE061
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$PACKAGE_URL" -o win-unpacked.zip
          echo "$PACKAGE_SHA256  win-unpacked.zip" | sha256sum --check --status
          unzip -tq win-unpacked.zip
          unzip -Z1 win-unpacked.zip | grep -Fxq './Snake 3D.exe'
          unzip -Z1 win-unpacked.zip | grep -Fxq './resources/app.asar'
      - name: Publish Snake 3D v1.1.5 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" --method POST -F tag_name=v1.1.5 -F name='Snake 3D v1.1.5' -F body='Fixes the embedded launch-ticket public key so it matches the 7x7Live launcher. License and launcher-ticket checks remain enabled.' -f make_latest=true
          gh release upload v1.1.5 win-unpacked.zip --repo "$GH_REPO"
