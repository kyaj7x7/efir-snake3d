name: Publish Snake 3D v1.1.6
on:
  push:
    paths:
      - .github/workflows/publish-snake-v116.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify package
        env:
          BASE_URL: https://7x7live.pro/codex-release-upload-20261101
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/snake3d-win-unpacked-v1.1.6.zip" -o package.zip
          echo '3995ac7e9514029df59cd7f25427f87f6de47cd5b171a375d3cffbc8eb41ca88  package.zip' | sha256sum --check --status
          test "$(stat -c%s package.zip)" -eq 160313379
          unzip -tq package.zip
          unzip -Z1 package.zip | grep -Fxq 'resources/app.asar'
          unzip -Z1 package.zip | grep -Fxq 'Snake 3D.exe'
      - name: Publish package as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" --method POST -f tag_name=v1.1.6 -f name='Snake 3D v1.1.6' -f body='Fixes the launch-ticket public key to match the current 7x7Live launcher. Authorization and signed ticket validation remain enabled.' -f draft=false -f prerelease=false -f make_latest=true
          gh release upload v1.1.6 package.zip#win-unpacked.zip --repo "$GH_REPO"
